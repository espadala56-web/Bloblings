<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1B1736">
<title>Bloblings</title>
<script src="https://telegram.org/js/telegram-web-app.js?64"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800&display=swap">
<link rel="stylesheet" href="./styles.css">
<script src="./vendor/phaser-4.2.1.min.js" defer></script>
<script type="module" src="./src/main.js"></script>
</head>
<body>
<div id="app">
  <header class="hud">
    <button id="energy-pill" type="button" class="pill pill-btn" data-i18n-label="energyLabel" aria-label="Energy">
      <span class="ico ico-energy" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z" fill="#4FD1E8" stroke="#0E3A44" stroke-width="1.5" stroke-linejoin="round"/></svg></span>
      <span class="pill-stack"><b id="energy-val">30/30</b><small id="energy-sub"></small></span>
      <span class="plus" aria-hidden="true">+</span>
    </button>
    <div class="pill" data-i18n-label="goldLabel" aria-label="Gold">
      <span class="ico ico-gold" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#FFC93C" stroke="#9A6A00" stroke-width="2"/><circle cx="12" cy="12" r="5" fill="none" stroke="#C98A00" stroke-width="2"/></svg></span>
      <b id="gold-val">0</b>
    </div>
    <div class="pill" data-i18n-label="crystalLabel" aria-label="Crystals">
      <span class="ico ico-crystal" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 2l8 7-8 13-8-13z" fill="#FF6FB5" stroke="#8C1F57" stroke-width="1.5" stroke-linejoin="round"/></svg></span>
      <b id="crystal-val">0</b>
    </div>
    <button id="settings-btn" type="button" class="icon-btn" data-i18n-label="settingsLabel" aria-label="Settings">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B8B0DD" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <div class="subbar">
    <div class="rate"><b id="rate-val"></b></div>
    <button id="daily-btn" type="button" class="chip chip-gift" data-i18n-label="dailyLabel" aria-label="Daily reward">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="9" width="18" height="12" rx="2.5" fill="#FF6FB5" stroke="#1A1430" stroke-width="1.8"/><rect x="2" y="6.5" width="20" height="4.5" rx="1.8" fill="#FF8CC6" stroke="#1A1430" stroke-width="1.8"/><path d="M12 6.5V21" stroke="#FFC93C" stroke-width="3"/><path d="M12 6.5c-1.5-3.5-5.5-4-5.5-1.5S10 6.5 12 6.5zm0 0c1.5-3.5 5.5-4 5.5-1.5S14 6.5 12 6.5z" fill="#FFC93C" stroke="#1A1430" stroke-width="1.5"/></svg>
      <span class="dot" aria-hidden="true"></span>
    </button>
    <button id="invite-btn" type="button" class="chip chip-invite" data-i18n-label="inviteLabel" aria-label="Invite friends">
      <svg width="22" height="20" viewBox="0 0 26 24" aria-hidden="true"><circle cx="9" cy="8" r="4.2" fill="#fff" stroke="#1A1430" stroke-width="1.8"/><path d="M2 20c0-4 3.2-6.5 7-6.5s7 2.5 7 6.5z" fill="#fff" stroke="#1A1430" stroke-width="1.8" stroke-linejoin="round"/><circle cx="20" cy="9" r="5" fill="#FFC93C" stroke="#1A1430" stroke-width="1.8"/><path d="M20 6.5v5M17.5 9h5" stroke="#1A1430" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>

  <main class="board-wrap"><div id="game"></div></main>

  <p id="hint" class="hint" aria-live="polite"></p>

  <nav class="toolbar">
    <button id="quests-btn" type="button" class="tool">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4FD1E8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 4V2.8h6V4M8.5 10l1.6 1.6 3-3M8.5 16h7"/></svg>
      <span data-i18n="questsLabel">Quests</span><i class="dot" aria-hidden="true"></i>
    </button>
    <button id="wheel-btn" type="button" class="tool">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="#FF6FB5" stroke="#1A1430" stroke-width="1.8"/><path d="M12 12L12 2.5A9.5 9.5 0 0 1 20.2 7.2Z M12 12L20.2 16.8A9.5 9.5 0 0 1 12 21.5Z M12 12L3.8 16.8A9.5 9.5 0 0 1 3.8 7.2Z" fill="#FFC93C"/><circle cx="12" cy="12" r="2.6" fill="#fff" stroke="#1A1430" stroke-width="1.6"/></svg>
      <span data-i18n="wheelLabel">Spin</span><i class="dot" aria-hidden="true"></i>
    </button>
    <button id="top-btn" type="button" class="tool">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFC93C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4.5a2.5 2.5 0 0 0 2.5 4M17 6h2.5a2.5 2.5 0 0 1-2.5 4M12 14v3M8.5 20h7l-1-3h-5z"/></svg>
      <span data-i18n="topLabel">Ranking</span>
    </button>
    <button id="album-btn" type="button" class="tool">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7FDB88" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M12 7.5l1.2 2.4 2.6.4-1.9 1.8.5 2.6-2.4-1.3-2.4 1.3.5-2.6-1.9-1.8 2.6-.4z" fill="#7FDB88" stroke="none"/></svg>
      <span id="album-val">0/42</span>
    </button>
  </nav>

  <div class="actions">
    <button id="egg-btn" type="button" class="btn-egg">
      <img src="./assets/egg.svg" alt="" width="38" height="38">
      <span data-i18n="openEgg">Open egg</span>
      <span class="cost" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z" fill="#4FD1E8"/></svg>1</span>
    </button>
    <button id="up-btn" type="button" class="btn-up" data-i18n-label="upgrade" aria-label="Upgrade">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1A1430" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V6M6 11l6-6 6 6"/><path d="M5 21h14"/></svg>
      <span class="dot" aria-hidden="true"></span>
    </button>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal" class="modal" hidden></div>
</div>
</body>
</html>
